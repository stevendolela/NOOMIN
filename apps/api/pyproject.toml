[project]
name = "noomin-api"
version = "0.1.0"
description = "NOOMIN modular SaaS API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.8,<3.0", "pydantic-settings>=2.4,<3.0", "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0", "redis>=5.0,<6.0", "celery>=5.4,<6.0", "email-validator>=2.2,<3.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["noomin_api*"]
