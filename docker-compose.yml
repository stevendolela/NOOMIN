services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noomin}
      POSTGRES_USER: ${POSTGRES_USER:-noomin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noomin_dev_only}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noomin} -d ${POSTGRES_DB:-noomin}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://noomin:noomin_dev_only@db:5432/noomin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me-use-at-least-32-characters}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn noomin_api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://noomin:noomin_dev_only@db:5432/noomin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me-use-at-least-32-characters}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A noomin_api.worker:celery_app worker --loglevel=info
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A noomin_api.worker:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
